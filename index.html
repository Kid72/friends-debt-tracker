<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0b57d0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dost Borcları" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Dostlar Borc & Xərc İzləyicisi — Material Design 3 PWA</title>

    <!-- Google Sans Web Font Support (Latin & Cyrillic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Product+Sans:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    
    <!-- Google Sans Font Direct CDN fallback -->
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/google-sans" />

    <style>
      @font-face {
        font-family: 'Google Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('Google Sans Regular'), local('GoogleSans-Regular'),
             url('https://fonts.gstatic.com/s/googlesans/v45/4UaGrENHsxJlGDuGo1OIlL3Kwp5MKg.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Google Sans';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: local('Google Sans Medium'), local('GoogleSans-Medium'),
             url('https://fonts.gstatic.com/s/googlesans/v45/4UabrENHsxJlGDuGo1OIlLU94Yt3CwZ-Pw.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Google Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: local('Google Sans Bold'), local('GoogleSans-Bold'),
             url('https://fonts.gstatic.com/s/googlesans/v45/4UabrENHsxJlGDuGo1OIlLV154t3CwZ-Pw.woff2') format('woff2');
      }
      body {
        font-family: 'Google Sans', 'Google Sans Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafd;
        color: #1f1f1f;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
    </style>
  </head>
  <body class="bg-m3-surface min-h-screen antialiased selection:bg-m3-primary-container selection:text-m3-on-primary-container">
